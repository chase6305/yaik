name: Marvin M6 solvers

on:
  pull_request:
    paths:
      - 'gallery/marvin_m6/**'
      - 'codegen/**'
      - 'fk/**'
      - 'solver/**'
      - 'utility/**'
      - '*codegen.py'
      - 'ik_solve.py'
      - 'convert_kinematic_chain.py'
      - 'python_run_import.py'
      - 'yaik_cpp_common.h'
      - 'yaik.py'
      - 'test_cli.py'
      - 'requirements.txt'
      - '.github/workflows/marvin-m6.yml'
  push:
    branches: [main]
    paths:
      - 'gallery/marvin_m6/**'
      - 'codegen/**'
      - 'fk/**'
      - 'solver/**'
      - 'utility/**'
      - '*codegen.py'
      - 'ik_solve.py'
      - 'convert_kinematic_chain.py'
      - 'python_run_import.py'
      - 'yaik_cpp_common.h'
      - 'yaik.py'
      - 'test_cli.py'
      - 'requirements.txt'
      - '.github/workflows/marvin-m6.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev
          python -m pip install -r requirements.txt pytest
      - name: Check generated artifacts
        run: python yaik.py marvin check
      - name: Run regression tests
        run: python -m pytest test_cli.py gallery/marvin_m6 solver/test_regressions.py solver/test_codegen_safety.py solver/test_equation_branches.py solver/test_family_critical.py solver/test_completeness.py solver/test_linear_circles.py -q
      - name: Validate Python and compiled C++ against URDF
        run: python yaik.py marvin validate --samples 1000 --stress-samples 2000 --seed 20261103 --output /tmp/marvin-m6-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marvin-m6-validation
          path: /tmp/marvin-m6-validation.json
          if-no-files-found: ignore
